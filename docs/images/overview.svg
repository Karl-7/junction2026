<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f6e69"/></marker>
  </defs>
  <rect width="960" height="360" rx="16" fill="#fcfcfb"/>
  <text x="32" y="40" font-size="20" font-weight="700" fill="#0b0b0b">Same lab task for every agent, one sentence of reasoning per decision</text>

  <!-- agents -->
  <g font-size="15" font-weight="600">
    <rect x="32" y="70" width="170" height="48" rx="10" fill="#fdf4dc" stroke="#eda100"/><circle cx="54" cy="94" r="7" fill="#eda100"/><text x="70" y="91" fill="#0b0b0b">Gemini models</text><text x="70" y="109" font-size="11" font-weight="400" fill="#52514e">5 models, main study</text>
    <rect x="32" y="130" width="170" height="48" rx="10" fill="#fdeee7" stroke="#eb6834"/><circle cx="54" cy="154" r="7" fill="#eb6834"/><text x="70" y="151" fill="#0b0b0b">Claude / GPT</text><text x="70" y="169" font-size="11" font-weight="400" fill="#52514e">optional</text>
    <rect x="32" y="190" width="170" height="48" rx="10" fill="#e8f0fb" stroke="#2a78d6"/><circle cx="54" cy="214" r="7" fill="#2a78d6"/><text x="70" y="211" fill="#0b0b0b">Human players</text><text x="70" y="229" font-size="11" font-weight="400" fill="#52514e">play in the terminal</text>
    <rect x="32" y="250" width="170" height="48" rx="10" fill="#f1f0ec" stroke="#8a8984"/><circle cx="54" cy="274" r="7" fill="#8a8984"/><text x="70" y="271" fill="#0b0b0b">Curie-style script</text><text x="70" y="289" font-size="11" font-weight="400" fill="#52514e">expert baseline</text>
  </g>
  <path d="M206 184 H262" stroke="#6f6e69" stroke-width="2" marker-end="url(#ar)"/>

  <!-- lab -->
  <rect x="268" y="70" width="330" height="228" rx="12" fill="#ffffff" stroke="#dddcd6"/>
  <text x="288" y="98" font-size="16" font-weight="700" fill="#0b0b0b">Simulated radiochemistry lab</text>
  <text x="288" y="120" font-size="13" fill="#52514e">Isolate a hidden radioactive element from an ore.</text>
  <text x="288" y="138" font-size="13" fill="#52514e">New hidden chemistry for every seed.</text>
  <rect x="288" y="154" width="300" height="124" rx="8" fill="#efeeea"/>
  <text x="300" y="178" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0b0b0b">crystallize(sample_id="S7",</text>
  <text x="316" y="196" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#0b0b0b">fraction=0.4,</text>
  <text x="316" y="214" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#c4321f">reason="Reagents can't split</text>
  <text x="332" y="232" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#c4321f">the target from its carrier,</text>
  <text x="332" y="250" font-size="13" font-family="ui-monospace,Menlo,Consolas,monospace" fill="#c4321f">so enrich it by crystallising")</text>
  <text x="300" y="268" font-size="11" fill="#6f6e69">every call must carry a one-sentence key reason</text>
  <path d="M602 184 H658" stroke="#6f6e69" stroke-width="2" marker-end="url(#ar)"/>

  <!-- scores -->
  <rect x="664" y="70" width="264" height="104" rx="12" fill="#ffffff" stroke="#dddcd6"/>
  <text x="684" y="98" font-size="16" font-weight="700" fill="#0b0b0b">Task reward (0–1)</text>
  <text x="684" y="122" font-size="13" fill="#52514e">purity, recovery, atomic weight,</text>
  <text x="684" y="140" font-size="13" fill="#52514e">carrier element, scored from the</text>
  <text x="684" y="158" font-size="13" fill="#52514e">hidden truth</text>
  <rect x="664" y="186" width="264" height="112" rx="12" fill="#ffffff" stroke="#dddcd6"/>
  <text x="684" y="214" font-size="16" font-weight="700" fill="#0b0b0b">Grounded reasoning (0–1)</text>
  <text x="684" y="238" font-size="13" fill="#52514e">each decision, stated fact and</text>
  <text x="684" y="256" font-size="13" fill="#52514e">prediction checked against the</text>
  <text x="684" y="274" font-size="13" fill="#52514e">hidden truth, step by step</text>
  <text x="32" y="334" font-size="13" fill="#52514e">Results and every step's reason are shown on a static website (docs/index.html and docs/runs.html).</text>
</svg>
